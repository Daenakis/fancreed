# Smoke test: sign-in → home → profile → log out → back to sign-in.
# Needs an activated account on the real backend, passed as env vars
# (never commit credentials):
#   maestro test -e EMAIL=you@example.com -e PASSWORD=secret .maestro/smoke.yaml
appId: com.fancreed.app.dev # dev bundle id (see env.ts)
---
# Launch the app from scratch so the auth state is cleared.
- launchApp:
    clearState: true

# Dev Client only: clearState also forgets the last Metro server, so connect
# to the running one from the launcher and dismiss the dev-menu onboarding.
- runFlow:
    when:
      visible: 'Development Build'
    commands:
      - tapOn: 'http://.*:8081'
      - tapOn:
          text: 'Continue'
          optional: true
      - tapOn:
          text: 'Close'
          optional: true

# Sign-in screen should be visible (after the logo intro).
- extendedWaitUntil:
    visible: 'Sign in to your account'
    timeout: 15000

# Fill the form — the button unlocks once both fields have a value.
- tapOn: 'Email'
- inputText: ${EMAIL}
- tapOn: 'Sign in to your account' # dismiss the keyboard
- tapOn: 'Password'
- inputText: ${PASSWORD}
- tapOn: 'Sign in to your account'
- tapOn: 'Sign In'

# Home with live data — confirms the auth flow and the API work.
- extendedWaitUntil:
    visible: 'Latest news'
    timeout: 15000
- assertVisible: 'All news'

# Profile (deep link: the dev-menu gear covers the header avatar).
- openLink: 'fancreed-dev://profile'
- extendedWaitUntil:
    visible: 'Favourite player'
    timeout: 10000

# Log out and verify we land back on the sign-in screen.
- scrollUntilVisible:
    element: 'Log out'
- tapOn: 'Log out'
- extendedWaitUntil:
    visible: 'Sign in to your account'
    timeout: 10000
